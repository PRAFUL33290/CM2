<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist · Bal des CM2 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body data-page="playlist" data-theme="dark">
    <div class="sakura-layer" data-sakura></div>
    <header class="topbar">
      <div class="site-shell topbar-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark">🎧</span>
          <span>
            <span class="brand-title">Bal des CM2 2026</span>
            <span class="brand-subtitle">Bibliothèque musicale DJ</span>
          </span>
        </a>
        <nav class="nav-links" data-nav></nav>
      </div>
    </header>

    <main class="site-shell section">
      <section class="page-header card">
        <span class="eyebrow">Page clé</span>
        <h1>Grande bibliothèque musicale</h1>
        <p>Recherche rapide, filtres utiles en direct, favoris, historique des morceaux joués et ordre recommandé DJ.</p>
      </section>

      <section class="section playlist-layout">
        <aside class="panel playlist-sidebar">
          <h3>Filtres playlist</h3>
          <div class="filters">
            <input type="search" placeholder="Rechercher un titre, artiste, style..." data-playlist-filter data-filter-search />
            <select data-playlist-filter data-filter-energy>
              <option value="0">Toutes les énergies</option>
              <option value="1">1 étoile</option>
              <option value="2">2 étoiles</option>
              <option value="3">3 étoiles</option>
              <option value="4">4 étoiles</option>
              <option value="5">5 étoiles</option>
            </select>
            <select data-playlist-filter data-filter-style>
              <option value="all">Tous les styles</option>
              <option>Ambiance Japon</option>
              <option>Generiques Anime</option>
              <option>K-POP</option>
              <option>Hits CM2 2026</option>
              <option>TikTok Kids Friendly</option>
              <option>Danse Facile</option>
              <option>Battle Dance</option>
              <option>Jeux Video</option>
              <option>Fin de Soiree</option>
            </select>
            <select data-playlist-filter data-filter-moment>
              <option value="all">Tous les moments</option>
              <option>Accueil</option>
              <option>Ouverture</option>
              <option>Dancefloor</option>
              <option>Animation</option>
              <option>Battle Dance</option>
              <option>Blind Test</option>
              <option>Photo souvenir</option>
              <option>Final</option>
            </select>
            <label><input type="checkbox" data-playlist-filter data-filter-recommended /> Recommandées DJ seulement</label>
          </div>
          <div class="toolbar">
            <button type="button" class="ghost-button" data-toggle-theme>Changer le thème</button>
            <button type="button" class="ghost-button" data-export-history>Exporter l’historique</button>
          </div>
        </aside>

        <div class="tracks-list">
          <section class="panel" data-playlist-summary></section>
          <section class="panel">
            <h3>Titres disponibles</h3>
            <div class="tracks-list" data-tracks></div>
          </section>
        </div>
      </section>
    </main>

    <footer data-footer></footer>
  </body>
</html>
