<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ Mix – Bal des CM2 2026</title>
    <meta name="description" content="Assistant DJ pour enchaîner les musiques du Bal des CM2 2026." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-icon">🎧</span>
          <div>
            <div class="brand-title">DJ Mix – Bal CM2</div>
            <div class="brand-sub">Enchaîne les morceaux facilement</div>
          </div>
        </div>
        <div class="topbar-actions">
          <button id="btn-shuffle" title="Mélanger la file">🔀 Shuffle</button>
          <button id="btn-clear-queue" title="Vider la file">🗑️ Vider file</button>
        </div>
      </div>
    </header>

    <main class="layout">
      <!-- NOW PLAYING -->
      <section class="now-playing" id="now-playing">
        <div class="np-label">En cours</div>
        <div class="np-title" id="np-title">Aucun morceau</div>
        <div class="np-artist" id="np-artist">–</div>
        <div class="np-controls">
          <button id="btn-prev" title="Précédent">⏮</button>
          <button id="btn-next" title="Suivant">⏭ Suivant</button>
        </div>
      </section>

      <div class="columns">
        <!-- QUEUE -->
        <section class="panel queue-panel">
          <h2>📋 File d'attente <span id="queue-count" class="badge">0</span></h2>
          <p class="hint">Glisse-dépose pour réordonner. Clique ▶ pour jouer immédiatement.</p>
          <div id="queue-list" class="track-list queue-list"></div>
        </section>

        <!-- LIBRARY -->
        <section class="panel library-panel">
          <h2>🎵 Bibliothèque <span id="lib-count" class="badge">10</span></h2>
          <input type="search" id="search" placeholder="Rechercher titre ou artiste…" autocomplete="off" />
          <div class="filters">
            <button class="filter-btn active" data-filter="all">Tout</button>
            <button class="filter-btn" data-filter="kpop">K-Pop</button>
            <button class="filter-btn" data-filter="pop">Pop</button>
            <button class="filter-btn" data-filter="dance">Dance</button>
            <button class="filter-btn" data-filter="anime">Anime</button>
            <button class="filter-btn" data-filter="disney">Disney</button>
            <button class="filter-btn" data-filter="phonk">Phonk</button>
          </div>
          <div id="library-list" class="track-list"></div>
        </section>
      </div>
    </main>
  </body>
</html>
